<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #243bff33, transparent 35%),
        radial-gradient(circle at bottom right, #00d4ff22, transparent 35%),
        #070b18;
      color: white;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-box {
      background: rgba(15, 22, 45, 0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #4169ff, #00d4ff);
      box-shadow: 0 0 35px rgba(0,180,255,0.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ba5c5;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b9c2df;
      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid #293252;
      outline: none;
      background: #0b1125;
      color: white;
      font-size: 15px;
      transition: 0.25s;
    }

    input:focus {
      border-color: #4d7cff;
      box-shadow: 0 0 0 3px rgba(77,124,255,0.12);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #8d98b8;
      user-select: none;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #6e9aff;
      font-size: 13px;
      text-decoration: none;
      margin-top: -7px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #4169ff, #00aeea);
      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(40,130,255,0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #66708f;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #293252;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #303957;
      background: #10172d;
      color: white;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      transition: 0.25s;
    }

    .google-btn:hover {
      background: #171f3a;
      border-color: #465274;
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .signup {
      text-align: center;
      color: #8993b2;
      font-size: 13px;
      margin-top: 25px;
    }

    .signup a {
      color: #6e9aff;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
    }

    .success {
      display: block !important;
      background: #123a2a;
      color: #61e6a2;
    }

    .error {
      display: block !important;
      background: #3a1720;
      color: #ff7d91;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-box">

      <div class="logo">M</div>

      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue to your account</p>

      <form id="loginForm">

        <div class="input-group">
          <label>Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="input-group">
          <label>Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              minlength="6"
            >

            <span
              class="show-password"
              onclick="togglePassword()"
            >👁</span>
          </div>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button type="submit" class="login-btn">
          Sign In
        </button>

      </form>

      <div class="divider">OR</div>

      <button class="google-btn" onclick="googleLogin()">

        <svg class="google-icon"
          viewBox="0 0 24 24">

          <path
            fill="#4285F4"
            d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"/>

          <path
            fill="#34A853"
            d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.5z"/>

          <path
            fill="#FBBC05"
            d="M6.54 13.59A5.85 5.85 0 0 1 6.23 12c0-.55.11-1.09.31-1.59V7.89H3.3A9.5 9.5 0 0 0 2.5 12c0 1.53.37 2.98 1.02 4.11l3.02-2.52z"/>

          <path
            fill="#EA4335"
            d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.47 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.52C7.31 8.1 9.46 6.38 12 6.38z"/>

        </svg>

        Continue with Google

      </button>

      <div id="message"></div>

      <p class="signup">
        Don't have an account?
        <a href="#">Create account</a>
      </p>

    </div>
  </div>

  <script>

    function togglePassword() {
      const password = document.getElementById("password");

      if (password.type === "password") {
        password.type = "text";
      } else {
        password.type = "password";
      }
    }

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        if (!email || !password) {
          message.className = "error";
          message.textContent =
            "Please enter your email and password.";
          return;
        }

        message.className = "success";
        message.textContent =
          "Login information submitted.";

        /*
          IMPORTANT:

          In a real website, NEVER store passwords
          directly inside this HTML/JavaScript.

          Send the credentials securely to your
          authentication backend instead.
        */
      });


    function googleLogin() {

      const message =
        document.getElementById("message");

      message.className = "success";
      message.textContent =
        "Google sign-in needs to be connected to Google OAuth.";

    }

  </script>

</body>
</html>
