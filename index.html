<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAPS // Wi-Fi Radar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #020617;
  color: #e2e8f0;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* BACKGROUND */

body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  left: -200px;
  top: -200px;
  background: #00e5ff;
  filter: blur(180px);
  opacity: .12;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  right: -200px;
  bottom: -200px;
  background: #7c3aed;
  filter: blur(180px);
  opacity: .12;
  z-index: -2;
}

/* HEADER */

header {
  height: 70px;
  padding: 0 30px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid rgba(0,229,255,.2);

  background: rgba(2,6,23,.85);

  backdrop-filter: blur(20px);
}

.logo {
  color: #00e5ff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 5px;

  text-shadow:
    0 0 15px #00e5ff;
}

.status {
  color: #34d399;
  font-size: 12px;
}

/* MAIN */

.container {
  max-width: 1250px;
  margin: auto;
  padding: 30px;
}

.title h1 {
  margin-bottom: 5px;
  font-size: 38px;
}

.title span {
  color: #00e5ff;
  text-shadow: 0 0 15px #00e5ff;
}

.title p {
  color: #64748b;
}

/* GRID */

.dashboard {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 25px;
}

/* RADAR */

.panel {
  background: rgba(15,23,42,.7);
  border: 1px solid rgba(0,229,255,.18);
  border-radius: 20px;
  padding: 22px;

  backdrop-filter: blur(15px);

  box-shadow:
    0 0 30px rgba(0,229,255,.05);
}

.panel-title {
  color: #00e5ff;
  font-weight: bold;
  margin-bottom: 15px;
}

/* RADAR CIRCLE */

.radar-container {
  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 500px;
}

.radar {
  position: relative;

  width: 430px;
  height: 430px;

  max-width: 90vw;
  max-height: 90vw;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(0,229,255,.08),
      rgba(0,0,0,.2)
    );

  border: 2px solid #00e5ff;

  box-shadow:
    0 0 20px rgba(0,229,255,.25),
    inset 0 0 40px rgba(0,229,255,.08);

  overflow: hidden;
}

/* RADAR RINGS */

.radar::before,
.radar::after {
  content: "";
  position: absolute;

  border: 1px solid rgba(0,229,255,.35);

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);
}

.radar::before {
  width: 66%;
  height: 66%;
}

.radar::after {
  width: 33%;
  height: 33%;
}

/* CROSSHAIR */

.cross-x,
.cross-y {
  position: absolute;
  background: rgba(0,229,255,.25);
}

.cross-x {
  width: 100%;
  height: 1px;
  top: 50%;
}

.cross-y {
  height: 100%;
  width: 1px;
  left: 50%;
}

/* SWEEP */

.sweep {
  position: absolute;

  width: 50%;
  height: 2px;

  left: 50%;
  top: 50%;

  transform-origin: left center;

  background: linear-gradient(
    90deg,
    #00e5ff,
    transparent
  );

  box-shadow: 0 0 15px #00e5ff;

  animation: sweep 3s linear infinite;
}

@keyframes sweep {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

/* CENTER */

.center-point {
  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #00e5ff;

  box-shadow:
    0 0 15px #00e5ff;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);
}

/* TARGETS */

.target {
  position: absolute;

  width: 14px;
  height: 14px;

  border-radius: 50%;

  background: #ef4444;

  box-shadow:
    0 0 15px #ef4444;

  animation: targetPulse 1.5s infinite;
}

@keyframes targetPulse {

  0%,100% {
    transform: scale(1);
    opacity: 1;
  }

  50% {
    transform: scale(1.5);
    opacity: .5;
  }

}

.target1 {
  left: 70%;
  top: 30%;
}

.target2 {
  left: 28%;
  top: 65%;
  background: #f59e0b;
  box-shadow: 0 0 15px #f59e0b;
}

.target3 {
  left: 55%;
  top: 78%;
  background: #34d399;
  box-shadow: 0 0 15px #34d399;
}

/* INFORMATION */

.info-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);

  gap: 15px;
}

.stat {
  padding: 18px;

  background: rgba(2,6,23,.65);

  border: 1px solid #1e293b;

  border-radius: 14px;
}

.stat-title {
  color: #64748b;
  font-size: 12px;
}

.stat-value {
  margin-top: 8px;

  color: #00e5ff;

  font-size: 24px;
  font-weight: bold;
}

/* SIGNAL GRAPH */

.graph {
  height: 150px;

  display: flex;
  align-items: end;

  gap: 4px;

  margin-top: 15px;

  padding: 10px;

  border-radius: 10px;

  background: #020617;
}

.bar {
  flex: 1;

  min-height: 5px;

  background: #00e5ff;

  box-shadow:
    0 0 8px #00e5ff;

  border-radius: 3px 3px 0 0;
}

/* ROOM LIST */

.room {
  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 13px 0;

  border-bottom: 1px solid #1e293b;
}

.room-name {
  color: #cbd5e1;
}

.room-status {
  color: #34d399;
  font-size: 12px;
}

/* BUTTON */

button {
  border: none;

  padding: 12px 18px;

  border-radius: 9px;

  background: #00e5ff;

  color: #001018;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 0 20px rgba(0,229,255,.4);
}

.danger {
  background: #ef4444;
  color: white;
}

/* RESPONSIVE */

@media(max-width: 900px) {

  .dashboard {
    grid-template-columns: 1fr;
  }

}

@media(max-width: 600px) {

  header {
    padding: 0 15px;
  }

  .container {
    padding: 18px;
  }

  .title h1 {
    font-size: 28px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    WAPS RADAR
  </div>

  <div class="status">
    ● SENSOR ONLINE
  </div>

</header>


<div class="container">

  <section class="title">

    <h1>
      Wi-Fi <span>Presence Radar</span>
    </h1>

    <p>
      Wireless environmental monitoring dashboard
    </p>

  </section>


  <div class="dashboard">

    <!-- RADAR -->

    <section class="panel">

      <div class="panel-title">
        📡 LIVE SIGNAL FIELD
      </div>

      <div class="radar-container">

        <div class="radar">

          <div class="cross-x"></div>
          <div class="cross-y"></div>

          <div class="sweep"></div>

          <div class="center-point"></div>

          <div class="target target1"></div>

          <div class="target target2"></div>

          <div class="target target3"></div>

        </div>

      </div>

    </section>


    <!-- RIGHT SIDE -->

    <section>

      <div class="panel">

        <div class="panel-title">
          SYSTEM STATUS
        </div>

        <div class="info-grid">

          <div class="stat">

            <div class="stat-title">
              SIGNAL
            </div>

            <div
              class="stat-value"
              id="signal"
            >
              -42 dBm
            </div>

          </div>


          <div class="stat">

            <div class="stat-title">
              DEVICES
            </div>

            <div
              class="stat-value"
              id="devices"
            >
              4
            </div>

          </div>


          <div class="stat">

            <div class="stat-title">
              ACTIVITY
            </div>

            <div
              class="stat-value"
              id="activity"
            >
              LOW
            </div>

          </div>


          <div class="stat">

            <div class="stat-title">
              MODE
            </div>

            <div class="stat-value">
              DEMO
            </div>

          </div>

        </div>

      </div>


      <!-- SIGNAL GRAPH -->

      <div class="panel" style="margin-top:20px;">

        <div class="panel-title">
          📈 SIGNAL ACTIVITY
        </div>

        <div
          class="graph"
          id="graph"
        ></div>

      </div>


      <!-- ROOMS -->

      <div class="panel" style="margin-top:20px;">

        <div class="panel-title">
          🏠 HOME MONITOR
        </div>


        <div class="room">

          <span class="room-name">
            Living Room
          </span>

          <span
            class="room-status"
            id="living"
          >
            ● Stable
          </span>

        </div>


        <div class="room">

          <span class="room-name">
            Bedroom
          </span>

          <span
            class="room-status"
            id="bedroom"
          >
            ● Stable
          </span>

        </div>


        <div class="room">

          <span class="room-name">
            Kitchen
          </span>

          <span
            class="room-status"
            id="kitchen"
          >
            ● Stable
          </span>

        </div>


        <div class="room">

          <span class="room-name">
            Garage
          </span>

          <span
            class="room-status"
            id="garage"
          >
            ● Stable
          </span>

        </div>

      </div>


      <div style="
        margin-top:20px;
        display:flex;
        gap:10px;
      ">

        <button onclick="startRadar()">
          START RADAR
        </button>

        <button
          class="danger"
          onclick="stopRadar()"
        >
          STOP
        </button>

      </div>

    </section>

  </div>

</div>


<script>

/*
  WAPS WI-FI RADAR
  DEMO MODE

  This generates simulated measurements.

  Later this can be replaced with
  real ESP32 / CSI measurements.
*/


let radarRunning = true;

const graph =
  document.getElementById("graph");


/* CREATE GRAPH */

for(let i = 0; i < 35; i++) {

  const bar =
    document.createElement("div");

  bar.className = "bar";

  bar.style.height =
    (Math.random() * 90 + 10) + "%";

  graph.appendChild(bar);

}


/* UPDATE SIGNAL */

function updateRadar() {

  if(!radarRunning)
    return;


  const signal =
    -30 - Math.floor(
      Math.random() * 35
    );

  document.getElementById(
    "signal"
  ).textContent =
    signal + " dBm";


  const devices =
    Math.floor(
      Math.random() * 5
    ) + 1;

  document.getElementById(
    "devices"
  ).textContent =
    devices;


  const activities =
    [
      "LOW",
      "LOW",
      "MEDIUM",
      "HIGH"
    ];

  const activity =
    activities[
      Math.floor(
        Math.random() *
        activities.length
      )
    ];

  document.getElementById(
    "activity"
  ).textContent =
    activity;


  /* UPDATE GRAPH */

  const bars =
    document.querySelectorAll(
      ".bar"
    );

  bars.forEach(bar => {

    bar.style.height =
      (
        Math.random() * 90 +
        10
      ) + "%";

  });


  /* SIMULATED ROOM ACTIVITY */

  const rooms = [
    "living",
    "bedroom",
    "kitchen",
    "garage"
  ];

  rooms.forEach(room => {

    const active =
      Math.random() > .75;

    const element =
      document.getElementById(
        room
      );

    if(active) {

      element.textContent =
        "● Movement";

      element.style.color =
        "#f59e0b";

    } else {

      element.textContent =
        "● Stable";

      element.style.color =
        "#34d399";

    }

  });

}


setInterval(
  updateRadar,
  1200
);


/* CONTROLS */

function startRadar() {

  radarRunning = true;

  document.querySelector(
    ".status"
  ).textContent =
    "● SENSOR ONLINE";

}


function stopRadar() {

  radarRunning = false;

  document.querySelector(
    ".status"
  ).textContent =
    "● SENSOR OFFLINE";

}

</script>

</body>
</html>
